name: Publish builds to GitHub Packages

# Publish a build of every push, so any commit is installable:
#
#   main:   @interline-io/catenary@<version>-main.<sha>             (dist-tag: main)
#   branch: @interline-io/catenary@<version>-branch.<branch>.<sha>  (dist-tag: <branch>)
#
# <version> is package.json's. Releases come from the Release workflow and keep
# the `latest` dist-tag; these builds are prereleases, which no range such as
# ^0.19.0 matches, so a consumer gets one only by pinning its exact string.
on:
  push:
    branches:
      - '**'

permissions: {}

# Cancel superseded branch-preview publishes (only the latest commit's preview
# matters), but never cancel on main: every main commit is a distinct build a
# consumer may pin, and queuing keeps the `main` dist-tag in commit order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@interline-io'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute version and tag
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BASE_VERSION=$(node -p "require('./package.json').version")
          if [ "$REF_NAME" = "main" ]; then
            echo "version=${BASE_VERSION}-main.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "tag=main" >> "$GITHUB_OUTPUT"
          else
            BRANCH=$(echo "$REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/^-//')
            echo "version=${BASE_VERSION}-branch.${BRANCH}.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "tag=${BRANCH}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version
        run: npm version ${{ steps.meta.outputs.version }} --no-git-tag-version

      - name: Prepare playground types
        run: pnpm dev:prepare

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Publish
        run: npm publish --tag ${{ steps.meta.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
